<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>

    <script>
        console.trace = () => {};
        console.warn = (msg) => {
            if (msg.includes('cdn.tailwindcss.com')) return;
        };
        console.log = () => {};
    </script>

    <script src="js/tailwindcss.3.4.17.js"></script>
    <link rel="stylesheet" href="css/tailwindcss.all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#3b82f6', secondary: '#10b981' },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient { @apply bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary; }
            .typing-cursor { border-right: 3px solid #3b82f6; animation: blink 1s infinite ease-in-out; }
            @keyframes blink { 0%,100% { border-color: transparent; } 50% { border-color: #3b82f6; } }
        }
    </style>
</head>

<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300">

<header class="fixed w-full top-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur-sm shadow-sm">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
        <a href="#" class="text-xl font-bold text-gradient">Homepage</a>
        <button id="theme-toggle" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-all">
            <i class="fas fa-moon dark:hidden text-lg"></i>
            <i class="fas fa-sun hidden dark:block text-lg text-yellow-400"></i>
        </button>
    </div>
</header>

<main class="min-h-screen flex flex-col items-center justify-center px-4 py-20">
    <div class="container mx-auto text-center">
        <div class="w-36 h-36 md:w-48 md:h-48 mx-auto rounded-full overflow-hidden border-4 border-primary/20 shadow-lg mb-6">
            <img src="img/37503943.png" alt="Avatar" class="w-full h-full object-cover">
        </div>

        <h1 class="text-4xl md:text-6xl font-bold mb-4 min-h-[60px] md:min-h-[80px]">
            <span id="typewriter" class="text-gradient typing-cursor"></span>
        </h1>
        
        <p class="text-lg md:text-xl text-gray-600 dark:text-gray-400 max-w-2xl mx-auto mb-10">
            Passionate about programming / Keep learning
        </p>
        
        <div class="flex justify-center gap-6 text-3xl mb-12">
            <a href="https://github.com/mecios" class="text-gray-600 dark:text-gray-400 hover:text-primary transition-colors"><i class="fab fa-github"></i></a>
        </div>

        <div class="max-w-2xl mx-auto grid grid-cols-2 sm:grid-cols-4 gap-5">
            <div class="flex flex-col items-center justify-between h-full gap-3 p-4 rounded-xl bg-white dark:bg-gray-800 shadow-md hover:shadow-lg transition">
                <i class="fa-brands fa-java text-3xl text-red-500"></i>
                <span class="font-medium">Java</span>
            </div>
            <div class="flex flex-col items-center justify-between h-full gap-3 p-4 rounded-xl bg-white dark:bg-gray-800 shadow-md hover:shadow-lg transition">
                <img src="img/kotlin.png" alt="Kotlin" class="w-7 h-7 object-contain">
                <span class="font-medium">Kotlin</span>
            </div>
            <div class="flex flex-col items-center justify-between h-full gap-3 p-4 rounded-xl bg-white dark:bg-gray-800 shadow-md hover:shadow-lg transition">
                <i class="fa-brands fa-android text-3xl text-green-500"></i>
                <span class="font-medium">Android</span>
            </div>
            <div class="flex flex-col items-center justify-between h-full gap-3 p-4 rounded-xl bg-white dark:bg-gray-800 shadow-md hover:shadow-lg transition">
                <i class="fa-brands fa-python text-3xl text-blue-500"></i>
                <span class="font-medium">Python</span>
            </div>
        </div>
    </div>
</main>

<footer class="w-full py-4 text-center text-sm text-gray-500">
    © 2026 Mecios. All rights reserved.
</footer>

<script>
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    });

    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    }

    const typewriter = document.getElementById('typewriter');
    const text = "Hello, I'm Mecios";
    let index = 0;
    function type() {
        if (index < text.length) {
            typewriter.textContent += text.charAt(index);
            index++;
            setTimeout(() => requestAnimationFrame(type), 110);
        }
    }
    window.addEventListener('DOMContentLoaded', () => { requestAnimationFrame(type) });
</script>
</body>
</html>
